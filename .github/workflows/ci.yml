name: CI

# Run once per change. `pull_request` covers branches with an open PR; scoping
# `push` to main avoids a duplicate run on every PR-branch push while still
# testing direct pushes/merges to the default branch.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs when new commits land on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    # Test on every OS we ship a binary for. macOS matters especially: the file
    # watcher uses a different notify backend there (FSEvents vs inotify), and
    # the worst watch regressions have been macOS-only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install latest stable Rust
        shell: bash
        run: |
          if ! command -v rustup > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt

          rustc --version
          cargo --version

      # libghostty-vt-sys compiles ghostty's VT core with `zig build` at
      # build time — no prebuilt libraries exist. Ghostty pins the Zig
      # version exactly; keep this in step with what the pinned
      # libghostty-vt release requires.
      - name: Install Zig (required by libghostty-vt-sys)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # The Go preset integration tests spawn a real `go` toolchain. The Ubuntu
      # runner image ships one, but the macOS image does not — install it
      # explicitly so both platforms exercise the same tests.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # The web UI bundle is embedded into the binary but isn't committed —
      # it's a build artifact. Build it before cargo so the embedded assets
      # are real; a couple of the web tests assert the app shell is served.
      # `npm ci` also typechecks the frontend via the build script.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI bundle
        run: npm --prefix web ci && npm --prefix web run build

      - name: Build
        run: cargo build --locked

      - name: Test
        # --no-fail-fast so a failure in one test binary doesn't hide failures
        # in the ones that sort after it — important while bringing up a new
        # platform (macOS) where several suites may need attention at once.
        run: cargo test --locked --no-fail-fast

      - name: Lint
        run: cargo clippy --locked -- -D warnings

      # Runs after the build so a formatting nit never masks a compile error —
      # the useful failure should be the one you see first.
      - name: Check formatting
        run: cargo fmt --check
