# don, running don.
#
# `don start` here gives you the dev loop for working on this repo:
#
#   * a dev daemon, rebuilt and restarted when you touch src/
#   * the Vite dev server, proxying to it, with hot reload
#   * a throwaway project (dev/demo) registered with the dev daemon, so the
#     UI has something to render
#   * clippy on every Rust save; `web/dist` rebuilt on every frontend save
#
#   don start                  # everything
#   don start --profile rust   # no npm: just the daemon and clippy
#   don ports                  # where things actually landed
#
# Then open the `web` address from `don ports` and you're editing the UI while
# watching it run don.
#
# Everything here is addressed dynamically so several checkouts can run at
# once. `fallback_ports` means the first instance gets the memorable ports and
# later ones get whatever's free, and both services sit behind Don proxies, so
# the address you opened survives the daemon restarting under you on every
# save.

min_version = "0.8.1"

default_profile = "all"

# Take the nice ports when they're free, an OS-assigned one when they aren't.
# This is what lets a second checkout start without a port fight.
fallback_ports = true

[profiles.all]
services = ["daemon", "web", "demo"]
tasks = ["clippy", "test", "web-install", "web-build"]

# For Rust-only work: skips npm and the demo stack, but still rebuilds and
# restarts the daemon so you can exercise changes by hand.
[profiles.rust]
services = ["daemon"]
tasks = ["clippy", "test"]

# --- services ---

# The daemon under development. Rebuilt and restarted whenever src/ changes,
# so the UI you're looking at is always the code you just wrote.
#
# Not the `rust.binary` preset: that passes extra args to `cargo build`, and
# this needs args on the *binary*.
#
# The proxy is what makes the restart-on-save loop bearable. Don holds the
# public port; the daemon binds an ephemeral one it's handed as DON_UI_PORT
# (which its `--port` flag reads). So when a save restarts the daemon, the
# address in your browser doesn't change and connections queue rather than
# fail.
#
# DON_STATE_DIR has to be absolute (see src/daemon/paths.rs) and per-checkout,
# which is what `${PWD}` gives: Don points it at the directory the service
# actually runs in.
[services.daemon]
build.cmd = "cargo"
build.args = ["build", "--bin", "don"]
run.cmd = "./target/debug/don"
run.args = ["daemon"]
env = { DON_STATE_DIR = "${PWD}/.don/dev-daemon" }
proxy = { listen = "127.0.0.1:3777", env = "DON_UI_PORT" }
watch = ["src/**/*.rs", "Cargo.toml"]
debounce = "500ms"
# The daemon answers on its ephemeral port; check the one Don handed it.
ready.tcp = "127.0.0.1:${DON_UI_PORT}"
ready.retries = 120

# Vite. `reload = false` because it has its own HMR — don restarting it on
# every save would throw away the thing it's for.
#
# Behind a proxy for the same reason as the daemon: a stable address you can
# leave open in a browser. `vite.config.ts` reads the injected PORT and pins
# `host: 127.0.0.1` — left to itself Vite binds `[::1]` only, which the proxy
# can't forward to.
#
# `$(daemon.addr)` is the daemon's *public* proxy address, so this survives
# the daemon restarting on every Rust save.
[services.web]
dir = "web"
run.cmd = "npm"
run.args = ["run", "dev"]
env = { DON_UI_TARGET = "http://$(daemon.addr)" }
proxy = { listen = "127.0.0.1:5173", env = "PORT" }
depends_on = ["daemon", "web-install"]
reload = false
ready.tcp = "127.0.0.1:${PORT}"
ready.retries = 60

# don, running don, running don. Registers dev/demo with the dev daemon so
# the UI has a project to show. Uses the freshly built binary, so it also
# smoke-tests that `don start` still works after your change.
#
# Same DON_STATE_DIR as the daemon — that's how the two find each other.
[services.demo]
run.cmd = "./target/debug/don"
run.args = ["--config", "dev/demo/don.toml", "start", "--no-tui"]
env = { DON_STATE_DIR = "${PWD}/.don/dev-daemon" }
depends_on = ["daemon"]
reload = false
# Its children need to stop before it reports done.
shutdown.timeout = "15s"

# --- tasks ---

[tasks.clippy]
cmd = "cargo"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]
watch = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml"]
debounce = "500ms"

# Not automatic: the suite takes about two minutes and would fight the
# daemon's rebuild over the cargo lock on every keystroke. Sits in
# pending_run instead — trigger it from the UI, or `don run test`.
[tasks.test]
cmd = "bash"
args = ["-c", "cargo test {{filter}}"]
auto_run = false

[[tasks.test.params]]
name = "filter"
prompt = "Test name filter (blank runs everything)"
default = ""

[tasks.web-install]
dir = "web"
cmd = "npm"
args = ["ci"]
watch = ["web/package-lock.json"]

# Keeps the committed bundle in step with the sources. CI fails on drift
# (web/dist is embedded in the binary and crates.io can't run npm), and
# noticing that at review time is much worse than noticing it here.
[tasks.web-build]
dir = "web"
cmd = "npm"
args = ["run", "build"]
depends_on = ["web-install"]
watch = ["web/src/**", "web/index.html", "web/vite.config.ts"]
debounce = "1s"
