[package]
name = "don"
version = "0.8.0"
edition = "2024"
description = "Boss of your dev environment"
license = "MIT"
repository = "https://github.com/pjtatlow/don"
homepage = "https://github.com/pjtatlow/don"
# An allowlist rather than `exclude`, because `include` is also what gets
# `web/dist` into the tarball: the built bundle is gitignored (it's a build
# artifact) but has to ship, since it's embedded in the binary and neither
# crates.io nor `cargo install` will run npm. CI builds it before publishing.
# Frontend sources and the dev tooling only matter to contributors.
include = [
    "src/**/*.rs",
    "build.rs",
    "web/dist/**",
    "README.md",
]


[dependencies]
aho-corasick = "1"
ansi-to-tui = "8"
axum = "0.8"
bollard = "0.21"
bytes = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
libghostty-vt = "0.2.1"
bzip2 = "0.6"
flate2 = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
futures-util = "0.3"
glob = "0.3"
hex = "0.4"
ignore = "0.4"
libc = "0.2"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1"] }
tower = "0.5"
tower-service = "0.3"
nix = { version = "0.31", features = ["signal", "process", "fs"] }
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
regex = "1"
pty-process = { version = "0.5", features = ["async"] }
quick-xml = "0.40"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
# Embeds web/dist into the binary for release builds; reads from disk in debug
# builds so the frontend can be iterated on without a cargo rebuild.
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tar = "0.4"
tokio = { version = "1", features = ["full", "test-util"] }
xz2 = "0.1"
zip = { version = "8", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64", "time", "zstd"] }
zstd = "0.13"
# `sync` enables BroadcastStream, used by the API's `GET /events` endpoint.
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

# Enforce no-panics-in-production as a build-time constraint.
# Test modules opt out via `#[allow(clippy::unwrap_used, ...)]`.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Library code should never println — OutputManager owns stdout.
# main.rs opts out for legitimate CLI output.
print_stdout = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
