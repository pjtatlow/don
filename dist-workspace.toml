[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew tap repository
tap = "pjtatlow/homebrew-tap"
# Publish jobs
publish-jobs = ["homebrew", "./publish-crates-io"]
# Steps injected before `dist build`. The web UI bundle is embedded in the
# binary but isn't committed, so release builds have to produce it first.
#
# Deliberately NOT under .github/workflows/: this is a fragment of steps, not
# a workflow, and anything ending in .yml in that directory is picked up and
# run by Actions on every push — which failed instantly, every time, because
# the fragment has no `on:` or `jobs:`. The path is relative to
# .github/workflows/, hence the `..`.
github-build-setup = "../build-setup.yml"

# cargo-dist 0.31 defaults Apple Silicon builds to the retiring macOS 14 image.
# Pin both macOS architectures to supported images instead of floating labels.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
